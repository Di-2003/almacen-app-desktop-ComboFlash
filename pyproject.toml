[project]
name = "Almacen"
version = "1.0.0"
description = "Almacen — multi-local con POS (Flet 1.0+)"
dependencies = [
    "flet==1.0.3",
    "openpyxl",
    "lxml>=5.0.0",
    "fpdf2>=2.7.8",
    "Pillow>=10.0.0",
]
[tool.flet]
product_name = "Almacen"
package_name = "com.combosflash.almacen"
icon = "assets/icon.png"
assets = ["assets"]

[tool.flet.icons]
windows = "assets/icon.ico"
linux   = "assets/icon.png"
macos   = "assets/icon.png"
web     = "assets/icon.png"

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"