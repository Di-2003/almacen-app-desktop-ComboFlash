[project]
name = "almacen-movil-raidel"
version = "1.0.0"
description = "Almacén Raidel — multi-local (Flet 1.0+)"
dependencies = [
    "flet==1.0.3",
    "openpyxl"
]

[tool.flet]
product_name = "Almacén Raidel"
package_name = "com.combosflash.almacen_raidel"
icon = "recursos/icon.png"
assets = ["recursos"]

[tool.flet.icons]
android = "recursos/icon.png"

# ─── PERMISOS ANDROID ──────────────────────────────────────
# Necesarios para que el FilePicker y el guardado de backups
# funcionen en Android 11+ (Scoped Storage).
# READ/WRITE se mantienen para compatibilidad con Android 9-10.
# MANAGE_EXTERNAL_STORAGE permite escribir en la carpeta elegida
# por el usuario sin restricciones de SAF (útil como respaldo).
[tool.flet.android.permission]
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
"android.permission.MANAGE_EXTERNAL_STORAGE" = true

# ─── SPLASH SCREEN (opcional) ───────────────────────────────
# Cuando tengas la imagen, colócala en recursos/splash.png
# y descomenta el bloque de abajo. Aparecerá como pantalla
# de carga nativa durante el arranque del APK en Android.
